name: Create annotated release tag

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

concurrency:
  group: create-annotated-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create verified annotated semantic-version tag
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release-tag ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.command.outputs.release_tag }}
      target_sha: ${{ steps.command.outputs.target_sha }}
    steps:
      - name: Validate exact owner command and reviewed target
        id: command
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(
              r"/release-tag (v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) ([0-9a-f]{40})",
              command,
          )
          if match is None:
              raise SystemExit("invalid release-tag command")
          tag = match.group(1)
          version = tag[1:]
          target_sha = match.group(5)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "mobile-proxy-release-tag-gate",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = (
              "https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs"
              f"?head_sha={target_sha}&event=push&per_page=100"
          )
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
              runs = json.load(response).get("workflow_runs", [])
          accepted = [
              run for run in runs
              if run.get("name") == "Quality"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target_sha
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not accepted:
              raise SystemExit("target SHA has no exact successful main Quality run")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"release_tag={tag}\n")
              handle.write(f"release_version={version}\n")
              handle.write(f"target_sha={target_sha}\n")
          PY

      - name: Check out exact reviewed target with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify canonical release identity and annotated-tag preconditions
        env:
          RELEASE_TAG: ${{ steps.command.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.command.outputs.release_version }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main --tags --force
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "release tag already exists" >&2
            exit 1
          fi
          python3 scripts/verify_android_release_contract.py \
            --root . \
            --expected-version "${RELEASE_VERSION}" \
            --output "${RUNNER_TEMP}/release-contract.json"

      - name: Create and push exact annotated release tag
        env:
          RELEASE_TAG: ${{ steps.command.outputs.release_tag }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "mobile-proxy ${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${TARGET_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Record safe release-tag checkpoint
        env:
          RELEASE_TAG: ${{ steps.command.outputs.release_tag }}
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Annotated release tag
          - Release tag: ${RELEASE_TAG}
          - Target SHA: ${TARGET_SHA}
          - Exact main Quality success required: true
          - Canonical Git/Cargo/Android version contract verified: true
          - Annotated tag object required: true
          EOF
