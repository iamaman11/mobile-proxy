name: Create protected release tag

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: canonical-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bind final tag to exact accepted candidate
    if: >-
      github.event.issue.number == 90 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release-tag ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMAND: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      ITEM20_ISSUE: '135'
      PHONE_SIGNING_ISSUE: '115'
    steps:
      - name: Parse exact owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/release-tag (v[0-9]+\.[0-9]+\.[0-9]+) ([0-9a-f]{40})", command)
          if match is None:
              raise SystemExit("invalid release-tag command")
          tag, target_sha = match.groups()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"target_sha={target_sha}\n")
          PY

      - name: Fetch canonical completion gates
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ITEM20_ISSUE" > item20.json
          gh api "repos/$GITHUB_REPOSITORY/issues/$PHONE_SIGNING_ISSUE" > phone-signing.json

      - name: Require completed Item 20 and exact single-SHA release markers
        id: acceptance
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          target_sha = os.environ["TARGET_SHA"]
          item20 = json.load(open("item20.json", encoding="utf-8"))
          signing = json.load(open("phone-signing.json", encoding="utf-8"))
          if item20.get("number") != 135 or item20.get("state") != "closed" or item20.get("state_reason") != "completed":
              raise SystemExit("Item 20 tracker #135 is not closed completed")
          if signing.get("number") != 115 or signing.get("state") != "closed" or signing.get("state_reason") != "completed":
              raise SystemExit("phone signing gate #115 is not closed completed")

          body = item20.get("body") or ""
          candidate_matches = re.findall(
              r"(?m)^final_release_candidate_sha:\s*([0-9a-f]{40})\s*$",
              body,
          )
          control_matches = re.findall(
              r"(?m)^final_release_control_plane_sha:\s*([0-9a-f]{40})\s*$",
              body,
          )
          if len(candidate_matches) != 1:
              raise SystemExit("Item 20 final release candidate marker is missing or ambiguous")
          if len(control_matches) != 1:
              raise SystemExit("Item 20 final release control-plane marker is missing or ambiguous")

          candidate_sha = candidate_matches[0]
          control_plane_sha = control_matches[0]
          if candidate_sha != control_plane_sha:
              raise SystemExit("Item 20 candidate and control-plane SHAs differ; 10/10 single-SHA acceptance is not satisfied")
          if target_sha != candidate_sha:
              raise SystemExit("target SHA does not match Item 20 accepted candidate marker")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"candidate_sha={candidate_sha}\n")
              handle.write(f"control_plane_sha={control_plane_sha}\n")
          PY

      - name: Require exact successful main Quality for accepted candidate
        env:
          TARGET_SHA: ${{ steps.acceptance.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
            > quality-runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET_SHA"]
          runs = json.load(open("quality-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [
              run for run in runs
              if run.get("name") == "Quality"
              and run.get("path") == ".github/workflows/quality.yml"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if len({run.get("id") for run in eligible}) != 1:
              raise SystemExit("exact accepted candidate must have exactly one eligible successful main Quality run")
          PY

      - name: Check out exact accepted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.acceptance.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact source and release-version contract
        env:
          TARGET_SHA: ${{ steps.acceptance.outputs.candidate_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          version="${RELEASE_TAG#v}"
          python3 scripts/verify_android_release_contract.py --expected-version "$version"

      - name: Require absent final tag
        env:
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists" >&2
            exit 1
          fi

      - name: Create and push exact annotated tag
        env:
          TARGET_SHA: ${{ steps.acceptance.outputs.candidate_sha }}
          CONTROL_PLANE_SHA: ${{ steps.acceptance.outputs.control_plane_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" \
            -m "Release $RELEASE_TAG — physically accepted candidate $TARGET_SHA; control plane $CONTROL_PLANE_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Record bounded release-authority result
        shell: bash
        run: |
          {
            echo '## Final release tag authority'
            echo "- Release tag: ${{ steps.command.outputs.tag }}"
            echo "- Accepted candidate SHA: ${{ steps.acceptance.outputs.candidate_sha }}"
            echo "- Accepted control-plane SHA: ${{ steps.acceptance.outputs.control_plane_sha }}"
            echo '- Candidate/control-plane exact equality required: true'
            echo '- Item 20 tracker closed completed: true'
            echo '- Phone signing gate closed completed: true'
            echo '- Exact main Quality required: true'
            echo '- Annotated tag required: true'
            echo '- Final tag target is physically accepted candidate: true'
            echo '- Production promotion authority created here: false'
          } >> "$GITHUB_STEP_SUMMARY"
