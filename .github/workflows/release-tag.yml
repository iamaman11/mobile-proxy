name: Create product release tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic product version tag, for example v0.1.4
        required: true
        type: string
      source_sha:
        description: Exact merged public main SHA to tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: product-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bind product Release tag to exact green main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate requested immutable product identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > main.json
          python3 - <<'PY'
          import json, os
          value = json.load(open('main.json', encoding='utf-8'))
          commit = value.get('commit') or {}
          if value.get('name') != 'main' or commit.get('sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('requested product Release source is not exact current main')
          PY

      - name: Require successful product Quality on exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" \
            > quality-runs.json
          python3 - <<'PY'
          import json, os
          target = os.environ['SOURCE_SHA']
          runs = json.load(open('quality-runs.json', encoding='utf-8')).get('workflow_runs', [])
          eligible = [
              run for run in runs
              if run.get('name') == 'Quality'
              and run.get('path') == '.github/workflows/quality.yml'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == target
              and run.get('event') == 'push'
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          ]
          if not eligible:
              raise SystemExit('exact product main SHA has no successful Quality run')
          PY

      - name: Check out exact green product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify version and absent tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          version="${RELEASE_TAG#v}"
          python3 scripts/verify_android_release_contract.py \
            --root . \
            --expected-version "$version" \
            --output "$RUNNER_TEMP/release-contract.json"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'product Release tag already exists' >&2
            exit 1
          fi

      - name: Create one annotated product Release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "Product Release $RELEASE_TAG — source $SOURCE_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Record product-only tag result
        run: |
          {
            echo '## Product Release tag'
            echo "- tag: $RELEASE_TAG"
            echo "- source_sha: $SOURCE_SHA"
            echo '- exact current main required: true'
            echo '- exact successful product Quality required: true'
            echo '- annotated tag required: true'
            echo '- phone/VM access performed: false'
            echo '- production deployment triggered by this workflow: false'
          } >> "$GITHUB_STEP_SUMMARY"
