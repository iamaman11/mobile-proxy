name: Create protected product release tag

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: canonical-product-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bind product tag to exact protected main
    if: >-
      github.event.issue.number == 90 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release-tag ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMAND: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Parse exact owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(
              r"/release-tag (v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) ([0-9a-f]{40})",
              command,
          )
          if match is None:
              raise SystemExit("invalid release-tag command")
          tag = match.group(1)
          target_sha = match.group(5)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"target_sha={target_sha}\n")
          PY

      - name: Require exact protected main
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > protected-main.json
          python3 - <<'PY'
          import json
          import os

          target_sha = os.environ["TARGET_SHA"]
          protected_main = json.load(open("protected-main.json", encoding="utf-8"))
          main_commit = protected_main.get("commit")
          if protected_main.get("name") != "main" or protected_main.get("protected") is not True:
              raise SystemExit("canonical main is not protected")
          if not isinstance(main_commit, dict) or main_commit.get("sha") != target_sha:
              raise SystemExit("target SHA does not equal exact protected main")
          PY

      - name: Require exact successful main Quality
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
            > quality-runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET_SHA"]
          runs = json.load(open("quality-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [
              run for run in runs
              if run.get("name") == "Quality"
              and run.get("path") == ".github/workflows/quality.yml"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not eligible:
              raise SystemExit("exact protected main has no eligible successful Quality push")
          PY

      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact source and release-version contract
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          version="${RELEASE_TAG#v}"
          python3 scripts/verify_android_release_contract.py \
            --root . \
            --expected-version "$version" \
            --output "${RUNNER_TEMP}/release-contract.json"

      - name: Require absent product tag
        env:
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "product release tag already exists" >&2
            exit 1
          fi

      - name: Create and push exact annotated product tag
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" \
            -m "Product Release $RELEASE_TAG — source $TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Record bounded product release authority result
        shell: bash
        run: |
          {
            echo '## Product release tag authority v2'
            echo "- Release tag: ${{ steps.command.outputs.tag }}"
            echo "- Exact protected main SHA: ${{ steps.command.outputs.target_sha }}"
            echo '- Exact successful main Quality required: true'
            echo '- Android product version contract verified: true'
            echo '- Annotated tag required: true'
            echo '- Physical acceptance required before product tag: false'
            echo '- Phone signing-generation gate required before product tag: false'
            echo '- Phone access performed: false'
            echo '- Deployment performed: false'
            echo '- Next authority: public immutable Product Release v2 publication'
          } >> "$GITHUB_STEP_SUMMARY"
