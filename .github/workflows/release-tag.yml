name: Create protected product release tag

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: canonical-product-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bind or recover product tag on exact protected main history
    if: >-
      github.event.issue.number == 90 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release-tag ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMAND: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Parse exact owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(
              r"/release-tag (v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) ([0-9a-f]{40})",
              command,
          )
          if match is None:
              raise SystemExit("invalid release-tag command")
          tag = match.group(1)
          target_sha = match.group(5)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"target_sha={target_sha}\n")
          PY

      - name: Require protected main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > protected-main.json
          python3 - <<'PY'
          import json
          import os

          protected_main = json.load(open("protected-main.json", encoding="utf-8"))
          main_commit = protected_main.get("commit")
          if protected_main.get("name") != "main" or protected_main.get("protected") is not True:
              raise SystemExit("canonical main is not protected")
          if not isinstance(main_commit, dict) or not isinstance(main_commit.get("sha"), str):
              raise SystemExit("canonical protected main SHA is unavailable")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha={main_commit['sha']}\n")
          PY

      - name: Require exact successful main Quality for target source
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
            > quality-runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET_SHA"]
          runs = json.load(open("quality-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [
              run for run in runs
              if run.get("name") == "Quality"
              and run.get("path") == ".github/workflows/quality.yml"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not eligible:
              raise SystemExit("exact protected main has no eligible successful Quality push")
          PY

      - name: Require exact successful Product Release prerequisites for target source
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
            > prerequisite-runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET_SHA"]
          runs = json.load(open("prerequisite-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [
              run for run in runs
              if run.get("name") == "Product Release prerequisites"
              and run.get("path") == ".github/workflows/product-release-prerequisites.yml"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not eligible:
              raise SystemExit(
                  "exact protected main has no eligible successful Product Release prerequisites push"
              )
          PY

      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.command.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact source lineage and release-version contract
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
          CURRENT_MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          version="${RELEASE_TAG#v}"
          python3 scripts/verify_android_release_contract.py \
            --root . \
            --expected-version "$version" \
            --output "${RUNNER_TEMP}/release-contract.json"

      - name: Classify exact product tag state
        id: tag_state
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
          CURRENT_MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          state=absent
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
            state=existing
          else
            if [[ "$TARGET_SHA" != "$CURRENT_MAIN_SHA" ]]; then
              echo "target SHA does not equal exact protected main" >&2
              exit 1
            fi
            test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Create and push exact annotated product tag
        if: steps.tag_state.outputs.state == 'absent'
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" \
            -m "Product Release $RELEASE_TAG — source $TARGET_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch exact Product Release publication or recovery
        env:
          RELEASE_TAG: ${{ steps.command.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "release_tag=$RELEASE_TAG"

      - name: Record bounded product release authority result
        shell: bash
        run: |
          {
            echo '## Product release tag authority v2'
            echo "- Release tag: ${{ steps.command.outputs.tag }}"
            echo "- Exact source SHA: ${{ steps.command.outputs.target_sha }}"
            echo "- Current protected main SHA: ${{ steps.main.outputs.sha }}"
            echo "- Tag state before command: ${{ steps.tag_state.outputs.state }}"
            echo '- Target source must be in current protected main history: true'
            echo '- Exact successful target-source main Quality required: true'
            echo '- Exact target-source Product Release prerequisites required: true'
            echo '- Android product version contract verified: true'
            echo '- Existing tag recovery requires exact annotated tag identity: true'
            echo '- New tag creation requires target to equal current protected main: true'
            echo '- Product Release publication explicitly dispatched: true'
            echo '- Physical acceptance required before product tag: false'
            echo '- Phone signing-generation gate required before product tag: false'
            echo '- Phone access performed: false'
            echo '- Deployment performed: false'
            echo '- Next authority: public immutable Product Release v2 publication'
          } >> "$GITHUB_STEP_SUMMARY"
