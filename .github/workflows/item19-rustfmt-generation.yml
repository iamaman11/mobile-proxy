name: Item19 rustfmt generation

on:
  push:
    branches:
      - item19-binding-store-vultr-executor

permissions:
  contents: write

concurrency:
  group: item19-rustfmt-generation
  cancel-in-progress: false

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: item19-binding-store-vultr-executor
          fetch-depth: 1

      - name: Install pinned Rust formatter
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rustfmt

      - name: Generate canonical formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/operator-cli/src/github_vm_binding_store.rs apps/operator-cli/src/vultr_client.rs | sort)"
          test "$changed" = "$expected"
          git diff --check
          cargo fmt --all -- --check

      - name: Commit rustfmt output only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operator-cli/src/github_vm_binding_store.rs apps/operator-cli/src/vultr_client.rs
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' apps/operator-cli/src/github_vm_binding_store.rs apps/operator-cli/src/vultr_client.rs | sort)"
          git commit -m "style: apply canonical rustfmt to item19 Slice A"
          git push origin HEAD:item19-binding-store-vultr-executor
