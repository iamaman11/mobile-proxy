name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published annotated tag, for example v0.1.0
        required: true
        type: string
      deploy_vm:
        description: Deploy relay VM
        required: true
        default: true
        type: boolean
      deploy_device:
        description: Deploy the attached Android device
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)
          test "$object_type" = tag
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy approved immutable SHA
    needs: validate
    environment: production
    runs-on:
      - self-hosted
      - Linux
      - X64
      - mobile-proxy-production
    timeout-minutes: 120
    steps:
      - name: Check out approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          clean: true
      - name: Verify immutable checkout and local prerequisites
        env:
          APPROVED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          command -v adb
          command -v gcloud
          test -x /home/bose/projects/secret-vault/bin/secret-vault
          scripts/with-production-secrets true
      - name: Prepare pinned runtime binaries
        if: inputs.deploy_vm || inputs.deploy_device
        run: cargo run --release --locked -p operator-cli -- prepare-runtime-binaries
      - name: Deploy and verify relay VM
        if: inputs.deploy_vm
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          release_id="git-${RELEASE_SHA:0:12}"
          scripts/with-production-secrets \
            cargo run --release --locked -p operator-cli -- provision-vm \
              --manifest-path deploy/manifests/vms/example-gcp-relay.json \
              --release-id "$release_id" \
              --ssh-user "${PRODUCTION_SSH_USER:-bose}"
      - name: Deploy and verify Android device
        if: inputs.deploy_device
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRODUCTION_DEVICE_SERIAL: ${{ vars.PRODUCTION_DEVICE_SERIAL }}
          PRODUCTION_TUNNEL_OWNER: ${{ vars.PRODUCTION_TUNNEL_OWNER }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DEVICE_SERIAL"
          release_id="git-${RELEASE_SHA:0:12}"
          owner="${PRODUCTION_TUNNEL_OWNER:-first_party_android_egress}"
          scripts/with-production-secrets \
            cargo run --release --locked -p operator-cli -- install-device-stack \
              --manifest-path deploy/manifests/devices/example-device.json \
              --release-id "$release_id" \
              --device-serial "$PRODUCTION_DEVICE_SERIAL" \
              --tunnel-owner "$owner"
      - name: Record deployment evidence
        if: always()
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          {
            echo '## Production deployment'
            echo "- Tag: $RELEASE_TAG"
            echo "- SHA: $RELEASE_SHA"
            echo "- VM requested: ${{ inputs.deploy_vm }}"
            echo "- Device requested: ${{ inputs.deploy_device }}"
          } >> "$GITHUB_STEP_SUMMARY"
