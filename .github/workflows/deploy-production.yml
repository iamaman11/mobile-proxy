name: Production deployment migration gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published tag being inspected; no deployment is performed.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-gate
  cancel-in-progress: false

jobs:
  blocked:
    name: Fail closed until split GitOps delivery exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the intentional migration gate
        run: |
          set -euo pipefail
          echo "Production deployment is blocked by architecture migration." >&2
          echo "Implement the GitHub-hosted Vultr adapter/workflow and private phone-control workflow first." >&2
          exit 1
