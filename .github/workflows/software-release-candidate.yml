name: Software Release Candidate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: software-release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  immutable-sha-acceptance:
    name: Immutable SHA Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Enforce architecture and policy boundaries
        id: architecture
        continue-on-error: true
        shell: bash
        run: |
          ARCHITECTURE_VALIDATION_LOG="${RUNNER_TEMP}/architecture-validation.log"
          set -o pipefail
          {
            python3 scripts/check_architecture_boundaries.py
            python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          } 2>&1 | tee "$ARCHITECTURE_VALIDATION_LOG"

      - name: Upload architecture diagnostics
        if: steps.architecture.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: architecture-validation-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/architecture-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce architecture result
        if: steps.architecture.outcome == 'failure'
        run: exit 1

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify lockfile reproducibility
        run: cargo metadata --format-version 1 --locked > /dev/null

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Prove process liveness and readiness
        run: cargo test -p control-plane --locked --test health_process -- --nocapture

      - name: Prove SQLite backup and clean restore
        run: cargo test -p control-plane --locked --test state_backup_cli -- --nocapture

      - name: Prove state migration and rollback compatibility
        run: cargo test -p control-plane --locked --test state_migration_cli -- --nocapture

      - name: Prove QUIC fallback, protected surfaces and recovery
        run: |
          cargo test -p reverse-tunnel --locked \
            --test hybrid_transport_recovery \
            --test hybrid_mixed_protocol_recovery \
            -- --nocapture

      - name: Run complete workspace acceptance
        run: cargo test --workspace --locked

      - name: Audit RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependency licenses, bans and sources
        id: cargo_deny
        continue-on-error: true
        shell: bash
        run: |
          CARGO_DENY_LOG="${RUNNER_TEMP}/cargo-deny.log"
          set -o pipefail
          cargo deny check advisories licenses bans sources 2>&1 | tee "$CARGO_DENY_LOG"

      - name: Upload cargo-deny diagnostics
        if: steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-deny-diagnostics-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/cargo-deny.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cargo-deny result
        if: steps.cargo_deny.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/android-app/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prove optional Android scaffold unit, lint and build quality
        shell: bash
        run: |
          set -euo pipefail
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy NO_PROXY no_proxy || true
          cd apps/android-app
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify candidate stayed immutable through acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if ! test -z "$(git status --porcelain)"; then
            git status --porcelain
            git diff --name-only
            exit 1
          fi

      - name: Write immutable candidate evidence
        run: |
          python3 scripts/write_release_candidate_evidence.py \
            --output release-candidate-evidence.json
          python3 -m json.tool release-candidate-evidence.json >/dev/null

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: software-release-candidate-${{ env.CANDIDATE_SHA }}
          path: release-candidate-evidence.json
          if-no-files-found: error
          retention-days: 90
