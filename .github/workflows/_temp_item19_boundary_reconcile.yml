        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \\
            -H 'Accept: application/vnd.github+json' \\
            -H 'X-GitHub-Api-Version: 2022-11-28' \\
            \"repos/$GITHUB_REPOSITORY/branches/main\" \\
            > current-main.json
          gh api \\
            -H 'Accept: application/vnd.github+json' \\
            -H 'X-GitHub-Api-Version: 2022-11-28' \\
            \"repos/$GITHUB_REPOSITORY/issues/115\" \\
            > signing-gate.json
""",
              """      - name: Fetch current protected main
        shell: bash
