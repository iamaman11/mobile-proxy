            -H 'X-GitHub-Api-Version: 2022-11-28' \\
            \"repos/$GITHUB_REPOSITORY/branches/main\" \\
            > current-main.json
""",
          )
          replace_once(
              workflow,
              """            --preflight-evidence preflight-evidence/vultr-readonly-preflight-evidence.json \\
            --signing-issue signing-gate.json \\
            --output item19-admission-evidence.json
""",
              """            --preflight-evidence preflight-evidence/vultr-readonly-preflight-evidence.json \\
            --output item19-admission-evidence.json
""",
          )
          replace_once(
              workflow,
              """            echo '- Physical acceptance window: explicitly ready'
            echo '- Signing continuity gate #115: closed'
""",
              """            echo '- Provider proof window: explicitly ready'
            echo '- Phone signing-continuity gate #115: not consumed by Item 19; required before Item 20 phone mutation'
""",
          )
          replace_once(
              workflow,
              """      - name: Revalidate exact-current gate and reconcile through typed acceptance lifecycle
