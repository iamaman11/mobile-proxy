name: Temporary Item 19 boundary reconciliation

on:
  push:
    branches:
      - item19-item20-boundary-reconciliation
    paths:
      - .github/workflows/_temp_item19_boundary_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: item19-item20-boundary-reconciliation
          fetch-depth: 2

      - name: Assert bounded bootstrap commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6764ca80a5d680683ddb45ec0804a1c1b673fc89"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/_temp_item19_boundary_reconcile.yml"

      - name: Apply exact architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = ".github/workflows/item19-acceptance-lifecycle.yml"
          replace_once(
