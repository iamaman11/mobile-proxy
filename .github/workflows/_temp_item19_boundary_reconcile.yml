name: Temporary Item 19 boundary reconciliation

on:
  push:
    branches:
      - item19-item20-boundary-reconciliation
    paths:
      - .github/workflows/_temp_item19_boundary_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: item19-item20-boundary-reconciliation
          fetch-depth: 0

      - name: Assert bounded bootstrap history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 6764ca80a5d680683ddb45ec0804a1c1b673fc89..HEAD)" = ".github/workflows/_temp_item19_boundary_reconcile.yml"

      - name: Apply exact architecture reconciliation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/item19-boundary-reconcile.py"
          python3 "$RUNNER_TEMP/item19-boundary-reconcile.py"
          cargo fmt --all
          python3 scripts/check_architecture_boundaries.py
          python3 -m unittest scripts.tests.test_item19_acceptance_lifecycle scripts.tests.test_private_phone_preflight
          git diff --check

      - name: Commit bounded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/item19-acceptance-lifecycle.yml apps/operator-cli/src/bin/item19-acceptance-lifecycle.rs contracts/operations/github-control-plane-v1.json docs/PRODUCTION_BASELINE_PLAN.md docs/operations/phone-gitops-runtime.md docs/physical-phone-acceptance-runbook.md scripts/check_item19_consistency.py scripts/tests/test_item19_acceptance_lifecycle.py scripts/verify_item19_acceptance_lifecycle.py
          git diff --cached --name-only | sort > changed.txt
          printf '%s\n' .github/workflows/item19-acceptance-lifecycle.yml apps/operator-cli/src/bin/item19-acceptance-lifecycle.rs contracts/operations/github-control-plane-v1.json docs/PRODUCTION_BASELINE_PLAN.md docs/operations/phone-gitops-runtime.md docs/physical-phone-acceptance-runbook.md scripts/check_item19_consistency.py scripts/tests/test_item19_acceptance_lifecycle.py scripts/verify_item19_acceptance_lifecycle.py | sort > expected.txt
          diff -u expected.txt changed.txt
          git commit -m "fix: reconcile item 19 provider proof and item 20 phone gate"
          git push origin HEAD:item19-item20-boundary-reconciliation
