name: Vultr acceptance authority

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read

concurrency:
  group: vultr-acceptance-authority
  cancel-in-progress: false

jobs:
  acceptance-gate:
    name: Validate immutable acceptance candidate
    if: >-
      github.event.issue.number == 90 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/accept-candidate ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      quality_run_id: ${{ steps.quality.outputs.run_id }}
    steps:
      - name: Validate trusted canonical control-plane ref
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iamaman11/mobile-proxy" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]

      - name: Check out immutable control-plane logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Parse exact candidate SHA
        id: candidate
        shell: bash
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          candidate_sha=$(python3 scripts/verify_acceptance_candidate.py parse-command --body-env COMMAND_BODY)
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Find successful canonical Quality push
        id: quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=push&status=success&head_sha=$CANDIDATE_SHA&per_page=100" \
            > quality-runs.json
          run_id=$(python3 scripts/verify_acceptance_candidate.py select-run \
            --candidate-sha "$CANDIDATE_SHA" \
            --runs quality-runs.json \
            --output selected-quality-run.json)
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact release-candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir candidate-evidence
          gh run download "$QUALITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "software-release-candidate-$CANDIDATE_SHA" \
            --dir candidate-evidence
          test -f candidate-evidence/release-candidate-evidence.json
          test "$(find candidate-evidence -maxdepth 2 -type f | wc -l)" -eq 1

      - name: Verify candidate evidence and write bounded acceptance identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 scripts/verify_acceptance_candidate.py verify \
            --candidate-sha "$CANDIDATE_SHA" \
            --selected-run selected-quality-run.json \
            --candidate-evidence candidate-evidence/release-candidate-evidence.json \
            --output acceptance-authority-evidence.json
          python3 -m json.tool acceptance-authority-evidence.json >/dev/null

      - name: Upload immutable acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vultr-acceptance-authority-${{ steps.candidate.outputs.sha }}
          path: acceptance-authority-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record safe acceptance result
        shell: bash
        run: |
          {
            echo '## Immutable Vultr acceptance authority'
            echo '- Authority: pre-release acceptance only'
            echo "- Candidate SHA: ${{ steps.candidate.outputs.sha }}"
            echo "- Canonical Quality run: ${{ steps.quality.outputs.run_id }}"
            echo '- Executor: GitHub-hosted'
            echo '- Final production authority: false'
            echo '- production-vultr authority: not granted'
            echo '- Vultr API access performed: false'
            echo '- VM mutation performed: false'
            echo '- Phone mutation performed: false'
            echo '- Final release tag created: false'
          } >> "$GITHUB_STEP_SUMMARY"
