name: Production control-plane preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate protected release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Validate protected v* release tag
        id: gate
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" == v* ]]
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$REF_PROTECTED" == "true" ]]
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  vultr-preflight:
    name: Vultr read-only preflight
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production-vultr
    timeout-minutes: 10
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
    steps:
      - name: Validate Vultr access and SSH private key
        id: vultr
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VULTR_API_KEY:-}" ]]
          [[ -n "${VULTR_SSH_PRIVATE_KEY:-}" ]]
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/vultr-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VULTR_SSH_PRIVATE_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VULTR_API_KEY}" \
            --header 'Accept: application/json' \
            --output /dev/null \
            'https://api.vultr.com/v2/account'

      - name: Record safe result
        if: always()
        shell: bash
        run: |
          {
            echo '## Production control-plane preflight'
            echo "- SHA: $GITHUB_SHA"
            echo '- Executor: GitHub-hosted'
            echo "- Vultr preflight: ${{ steps.vultr.outcome }}"
            echo '- Phone preflight: intentionally private-repository only'
          } >> "$GITHUB_STEP_SUMMARY"
