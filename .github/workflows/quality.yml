name: Quality

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}

jobs:
  classify:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        run: |
          python3 scripts/classify_changes.py \
            --base "$BASE_SHA" \
            --head "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

  policy:
    name: Architecture and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Enforce repository contracts
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          python3 scripts/check_architecture_boundaries.py
          python3 scripts/check_ten_out_of_ten_consistency.py
          python3 scripts/check_fact_first_execution.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          git diff --check

  rust:
    name: Rust workspace
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify locked dependency graph and formatting
        run: |
          cargo metadata --format-version 1 --locked > /dev/null
          cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run complete workspace tests
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify pinned WireGuard AAR provenance
        shell: bash
        run: |
          set -euo pipefail
          artifact="apps/android-app/app/libs/wireguard-tunnel-1.0.20260102.aar"
          checksum="apps/android-app/app/libs/wireguard-tunnel-1.0.20260102.aar.sha256"
          provenance="apps/android-app/app/libs/wireguard-tunnel-1.0.20260102.provenance.json"
          expected="2b9c16db026496123e4db695d26d03d1958a201096c7c4c89b21077dc70f3119"
          sha256sum --check "$checksum"
          test "$(awk '{print $1}' "$checksum")" = "$expected"
          test "$(stat -c %s "$artifact")" = "5830762"
          python3 - "$provenance" "$expected" <<'PY'
          import json
          import sys

          path, expected = sys.argv[1:]
          value = json.load(open(path, encoding="utf-8"))
          artifact = value.get("artifact", {})
          upstream = value.get("upstream", {})
          verification = value.get("verification", {})
          if value.get("format_version") != 1:
              raise SystemExit("WireGuard provenance format_version differs")
          if artifact != {
              "path": "apps/android-app/app/libs/wireguard-tunnel-1.0.20260102.aar",
              "size_bytes": 5830762,
              "sha256": expected,
          }:
              raise SystemExit("WireGuard vendored artifact metadata differs")
          required_upstream = {
              "maven_coordinate": "com.wireguard.android:tunnel:1.0.20260102",
              "packaging": "aar",
              "name": "WireGuard Tunnel Library",
              "publisher": "WireGuard",
              "project_url": "https://www.wireguard.com/",
              "scm_url": "https://git.zx2c4.com/wireguard-android",
              "license": "Apache-2.0",
              "artifact_url": "https://repo1.maven.org/maven2/com/wireguard/android/tunnel/1.0.20260102/tunnel-1.0.20260102.aar",
          }
          if upstream != required_upstream:
              raise SystemExit("WireGuard upstream provenance metadata differs")
          if verification.get("upstream_bytes_equal") is not True:
              raise SystemExit("WireGuard upstream byte identity is not recorded as proven")
          PY
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check RustSec advisories, licenses, bans and sources
        run: cargo deny check advisories licenses bans sources

  android:
    name: Android application
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android-app/*.gradle*
            apps/android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Enable KVM for managed Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit test, lint, assemble and framework smoke
        shell: bash
        run: |
          set -euo pipefail
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy NO_PROXY no_proxy || true
          cd apps/android-app
          bash ./gradlew --no-daemon \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            pixel2api35DebugAndroidTest

  release-candidate-evidence:
    name: Immutable release-candidate evidence
    needs:
      - classify
      - policy
      - rust
      - supply-chain
      - android
    if: >-
      always() &&
      needs.classify.outputs.code == 'true' &&
      github.event_name != 'merge_group' &&
      needs.policy.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Write immutable candidate evidence
        run: |
          python3 scripts/write_release_candidate_evidence.py \
            --output release-candidate-evidence.json
          python3 -m json.tool release-candidate-evidence.json >/dev/null
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: software-release-candidate-${{ env.CANDIDATE_SHA }}
          path: release-candidate-evidence.json
          if-no-files-found: error
          retention-days: 90

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - classify
      - policy
      - rust
      - supply-chain
      - android
      - release-candidate-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Write compact machine-readable evidence
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_CANDIDATE_RESULT: ${{ needs.release-candidate-evidence.result }}
          CODE_CHANGE: ${{ needs.classify.outputs.code }}
        run: |
          if [[ "$CODE_CHANGE" == true && "$GITHUB_EVENT_NAME" != merge_group ]]; then
            python3 scripts/write_ci_summary.py \
              --output quality-summary.json \
              --sha "$CANDIDATE_SHA" \
              --check "policy=$POLICY_RESULT" \
              --check "rust=$RUST_RESULT" \
              --check "supply_chain=$SUPPLY_CHAIN_RESULT" \
              --check "android=$ANDROID_RESULT" \
              --check "release_candidate=$RELEASE_CANDIDATE_RESULT"
          elif [[ "$CODE_CHANGE" == true ]]; then
            python3 scripts/write_ci_summary.py \
              --output quality-summary.json \
              --sha "$CANDIDATE_SHA" \
              --check "policy=$POLICY_RESULT" \
              --check "rust=$RUST_RESULT" \
              --check "supply_chain=$SUPPLY_CHAIN_RESULT" \
              --check "android=$ANDROID_RESULT"
          else
            python3 scripts/write_ci_summary.py \
              --output quality-summary.json \
              --sha "$CANDIDATE_SHA" \
              --check "policy=$POLICY_RESULT" \
              --check documentation_scope=success
          fi
          python3 scripts/repository_context.py --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-summary-${{ env.CANDIDATE_SHA }}
          path: quality-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce aggregate result
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_CANDIDATE_RESULT: ${{ needs.release-candidate-evidence.result }}
          CODE_CHANGE: ${{ needs.classify.outputs.code }}
        run: |
          test "$POLICY_RESULT" = success
          if [[ "$CODE_CHANGE" == true ]]; then
            test "$RUST_RESULT" = success
            test "$SUPPLY_CHAIN_RESULT" = success
            test "$ANDROID_RESULT" = success
            if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
              test "$RELEASE_CANDIDATE_RESULT" = skipped
            else
              test "$RELEASE_CANDIDATE_RESULT" = success
            fi
          else
            test "$RUST_RESULT" = skipped
            test "$SUPPLY_CHAIN_RESULT" = skipped
            test "$ANDROID_RESULT" = skipped
            test "$RELEASE_CANDIDATE_RESULT" = skipped
          fi
