name: Quality

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  policy:
    name: Architecture and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Enforce repository contracts
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          python3 scripts/check_architecture_boundaries.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          git diff --check

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify locked dependency graph and formatting
        run: |
          cargo metadata --format-version 1 --locked > /dev/null
          cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run complete workspace tests
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check licenses, bans and sources
        run: cargo deny check advisories licenses bans sources

  android:
    name: Android application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android-app/*.gradle*
            apps/android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Unit test, lint and assemble
        shell: bash
        run: |
          set -euo pipefail
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy NO_PROXY no_proxy || true
          cd apps/android-app
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - policy
      - rust
      - supply-chain
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Write compact machine-readable evidence
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          python3 scripts/write_ci_summary.py \
            --output quality-summary.json \
            --sha "$CANDIDATE_SHA" \
            --check "policy=$POLICY_RESULT" \
            --check "rust=$RUST_RESULT" \
            --check "supply_chain=$SUPPLY_CHAIN_RESULT" \
            --check "android=$ANDROID_RESULT"
          python3 scripts/repository_context.py --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-summary-${{ env.CANDIDATE_SHA }}
          path: quality-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce aggregate result
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$ANDROID_RESULT" = success
