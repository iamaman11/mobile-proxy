name: Apply Rustfmt Final

on:
  push:
    branches:
      - agent/native-runtime-blake3-audit

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-final
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/native-runtime-blake3-audit
          fetch-depth: 0
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply final rustfmt to native audit'
          git push origin HEAD:agent/native-runtime-blake3-audit
