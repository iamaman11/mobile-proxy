name: Vultr read-only acceptance preflight

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read

concurrency:
  group: vultr-readonly-acceptance-preflight
  cancel-in-progress: false

jobs:
  acceptance-gate:
    name: Verify immutable acceptance authority
    if: >-
      github.event.issue.number == 90 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/vultr-readonly-preflight ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      acceptance_run_id: ${{ steps.acceptance.outputs.run_id }}
      acceptance_run_attempt: ${{ steps.acceptance.outputs.run_attempt }}
    steps:
      - name: Validate trusted canonical control-plane ref
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iamaman11/mobile-proxy" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]

      - name: Check out immutable control-plane logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Parse exact candidate SHA
        id: candidate
        shell: bash
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          candidate_sha=$(python3 scripts/verify_vultr_readonly_preflight.py parse-command --body-env COMMAND_BODY)
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Select candidate-specific acceptance authority on exact control plane
        id: acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vultr-acceptance-authority-$CANDIDATE_SHA&per_page=100" \
            > acceptance-artifacts.json
          run_id=$(python3 scripts/verify_vultr_readonly_preflight.py select-artifact \
            --candidate-sha "$CANDIDATE_SHA" \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --artifacts acceptance-artifacts.json \
            --output selected-acceptance-artifact.json)
          artifact_id=$(python3 -c 'import json; print(json.load(open("selected-acceptance-artifact.json", encoding="utf-8"))["id"])')
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > selected-acceptance-run.json
          run_attempt=$(python3 -c 'import json; print(json.load(open("selected-acceptance-run.json", encoding="utf-8"))["run_attempt"])')
          {
            echo "artifact_id=$artifact_id"
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact acceptance-authority artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_ARTIFACT_ID: ${{ steps.acceptance.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID/zip" \
            > acceptance-evidence.zip
          mkdir acceptance-evidence
          unzip -q acceptance-evidence.zip -d acceptance-evidence
          test -f acceptance-evidence/acceptance-authority-evidence.json
          test "$(find acceptance-evidence -maxdepth 2 -type f | wc -l)" -eq 1

      - name: Verify immutable acceptance evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_vultr_readonly_preflight.py verify-acceptance \
            --candidate-sha "$CANDIDATE_SHA" \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --selected-artifact selected-acceptance-artifact.json \
            --selected-run selected-acceptance-run.json \
            --acceptance-evidence acceptance-evidence/acceptance-authority-evidence.json

  vultr-readonly-preflight:
    name: Validate Vultr read-only acceptance access
    needs: acceptance-gate
    runs-on: ubuntu-latest
    environment: acceptance-vultr
    timeout-minutes: 10
    steps:
      - name: Check out immutable control-plane logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate credential presence, SSH key, and account access
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${VULTR_API_KEY:-}" ]]
          [[ -n "${VULTR_SSH_PRIVATE_KEY:-}" ]]
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/vultr-acceptance-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$VULTR_SSH_PRIVATE_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          curl --fail --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${VULTR_API_KEY}" \
            --header 'Accept: application/json' \
            --output /dev/null \
            'https://api.vultr.com/v2/account'

      - name: Write bounded read-only evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.acceptance-gate.outputs.candidate_sha }}
          ACCEPTANCE_AUTHORITY_RUN_ID: ${{ needs.acceptance-gate.outputs.acceptance_run_id }}
          ACCEPTANCE_AUTHORITY_RUN_ATTEMPT: ${{ needs.acceptance-gate.outputs.acceptance_run_attempt }}
          COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 scripts/verify_vultr_readonly_preflight.py build-evidence \
            --candidate-sha "$CANDIDATE_SHA" \
            --output vultr-readonly-preflight-evidence.json
          python3 -m json.tool vultr-readonly-preflight-evidence.json >/dev/null

      - name: Upload bounded read-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vultr-readonly-preflight-${{ needs.acceptance-gate.outputs.candidate_sha }}
          path: vultr-readonly-preflight-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record safe result
        shell: bash
        run: |
          {
            echo '## Vultr read-only acceptance preflight'
            echo '- Authority: pre-release acceptance read-only'
            echo "- Candidate SHA: ${{ needs.acceptance-gate.outputs.candidate_sha }}"
            echo "- Acceptance authority run: ${{ needs.acceptance-gate.outputs.acceptance_run_id }}"
            echo '- Executor: GitHub-hosted'
            echo '- Account endpoint: GET /v2/account'
            echo '- Account response data recorded: false'
            echo '- Final production authority: false'
            echo '- VM lifecycle access performed: false'
            echo '- VM mutation performed: false'
            echo '- Phone mutation performed: false'
          } >> "$GITHUB_STEP_SUMMARY"
