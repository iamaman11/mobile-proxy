name: Publish Product Release v2

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated semantic-version tag to publish or recover
        required: true
        type: string
  workflow_run:
    workflows:
      - Quality
    types:
      - completed

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-product-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish immutable Product Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: product-release
    timeout-minutes: 90
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag }}
          fetch-depth: 0

      - name: Select exact annotated semantic tag
        id: tag
        env:
          VERIFIED_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
          VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags --force
          test "$(git cat-file -t "refs/tags/$VERIFIED_TAG")" = tag
          tag_sha=$(git rev-list -n 1 "$VERIFIED_TAG")
          if [[ -n "$VERIFIED_SHA" ]]; then
            test "$tag_sha" = "$VERIFIED_SHA"
          else
            VERIFIED_SHA="$tag_sha"
          fi
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          mapfile -t tags < <(git tag --points-at "$VERIFIED_SHA" --list 'v[0-9]*')
          test ${#tags[@]} -eq 1
          test "${tags[0]}" = "$VERIFIED_TAG"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$VERIFIED_TAG" = "v$version"
          python3 scripts/verify_android_release_contract.py \
            --root . \
            --expected-version "$version" \
            --output "${RUNNER_TEMP}/release-contract.json"
          {
            echo "name=$VERIFIED_TAG"
            echo "sha=$VERIFIED_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Require exact successful main Quality for source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" \
            > quality-runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["RELEASE_SHA"]
          runs = json.load(open("quality-runs.json", encoding="utf-8")).get("workflow_runs", [])
          eligible = [
              run for run in runs
              if run.get("name") == "Quality"
              and run.get("path") == ".github/workflows/quality.yml"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not eligible:
              raise SystemExit("tag target has no eligible successful Quality push on exact main SHA")
          PY

      - name: Fail closed unless repository immutable Releases are enabled
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_RELEASE_SETTINGS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > immutable-releases.json
          python3 - <<'PY'
          import json
          value = json.load(open("immutable-releases.json", encoding="utf-8"))
          if value.get("enabled") is not True:
              raise SystemExit("repository immutable Releases are not enabled")
          PY

      - name: Select provenance mode
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          owner_type=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          native=true
          if [[ "$visibility" = private && "$owner_type" = User ]]; then
            native=false
          fi
          {
            echo "native=$native"
            echo "visibility=$visibility"
            echo "owner_type=$owner_type"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android-app/*.gradle*
            apps/android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build Linux Product Release binaries
        run: |
          set -euo pipefail
          cargo build --release --locked \
            -p operator-cli \
            -p control-plane \
            -p relay-gate \
            -p reverse-tunnel-server

      - name: Package deterministic Linux artifact
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          stage="release/mobile-proxy-linux-x86_64-$RELEASE_TAG"
          mkdir -p "$stage/bin"
          install -m 0755 target/release/operator-cli "$stage/bin/"
          install -m 0755 target/release/control-plane "$stage/bin/"
          install -m 0755 target/release/relay-gate "$stage/bin/"
          install -m 0755 target/release/reverse-tunnel-server "$stage/bin/"
          cp Cargo.lock "$stage/"
          python3 scripts/repository_context.py --format json --output "$stage/repository-context.json"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 scripts/create_release_archive.py \
            --root "$stage" \
            --output "release/mobile-proxy-linux-x86_64-$RELEASE_TAG.tar.gz" \
            --source-date-epoch "$source_date_epoch"

      - name: Build and verify exact signed Android APK
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_signed_android_release.py \
            --repository-root . \
            --canonical-sha "$RELEASE_SHA" \
            --output-dir release
          python3 -m json.tool release/android-release-evidence.json >/dev/null

      - name: Prepare exact rooted-phone runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          mapfile -t ndks < <(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V)
          test ${#ndks[@]} -gt 0
          android_ndk="${ndks[${#ndks[@]}-1]}"
          cargo run --locked -p operator-cli --bin operator-cli -- \
            prepare-runtime-binaries \
            --android-ndk "$android_ndk"

      - name: Create exact Product Release v2 bundle
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          NATIVE_ATTESTATION: ${{ steps.provenance.outputs.native }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 scripts/create_release_bundle_v2.py \
            --repository-root . \
            --release-dir release \
            --tag "$RELEASE_TAG" \
            --source-sha "$RELEASE_SHA" \
            --android-evidence release/android-release-evidence.json \
            --phone-runtime-contract contracts/operations/phone-production-release-components-v1.json \
            --source-date-epoch "$source_date_epoch" \
            --builder "github-actions:iamaman11/mobile-proxy/.github/workflows/release.yml" \
            --workflow-ref "iamaman11/mobile-proxy/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
            --github-native-attestation "$NATIVE_ATTESTATION"
          python3 -m json.tool release/release-manifest.json >/dev/null
          python3 -m json.tool release/provenance.json >/dev/null
          python3 -m json.tool release/artifact-digests.json >/dev/null

      - name: Attest Product Release v2 bundle
        if: steps.provenance.outputs.native == 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/mobile-proxy-linux-x86_64-${{ steps.tag.outputs.name }}.tar.gz
            release/mobile-proxy-android-${{ steps.tag.outputs.name }}.apk
            release/mobile-proxy-phone-production-runtime-${{ steps.tag.outputs.name }}.tar.gz
            release/release-manifest.json
            release/provenance.json
            release/artifact-digests.json

      - name: Record fallback provenance mode
        if: steps.provenance.outputs.native != 'true'
        run: |
          {
            echo '## Provenance mode'
            echo 'GitHub-native build attestations are unavailable for this repository context.'
            echo 'The exact Product Release v2 bundle remains covered by provenance.json and typed artifact-digests.json.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect existing exact Release state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-pages.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          pages = json.load(open("release-pages.json", encoding="utf-8"))
          releases = [item for page in pages for item in page if item.get("tag_name") == tag]
          if len(releases) > 1:
              raise SystemExit("multiple GitHub Releases resolve to exact product tag")
          state = "none"
          release_id = ""
          if releases:
              release = releases[0]
              Path("existing-release.json").write_text(
                  json.dumps(release, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              release_id = str(release.get("id", ""))
              state = "draft" if release.get("draft") is True else "published"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"state={state}\n")
              handle.write(f"release_id={release_id}\n")
          PY

      - name: Verify an existing published Release is exact and immutable
        if: steps.existing.outputs.state == 'published'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_published_release_v2.py \
            --repository-root . \
            --release-json existing-release.json \
            --release-dir release \
            --tag "$RELEASE_TAG"

      - name: Verify an existing draft contract before recovery publish
        if: steps.existing.outputs.state == 'draft'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_published_release_v2.py \
            --repository-root . \
            --release-json existing-release.json \
            --release-dir release \
            --tag "$RELEASE_TAG" \
            --allow-draft

      - name: Create exact draft Release with all assets
        if: steps.existing.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            "release/mobile-proxy-linux-x86_64-$RELEASE_TAG.tar.gz" \
            "release/mobile-proxy-android-$RELEASE_TAG.apk" \
            "release/mobile-proxy-phone-production-runtime-$RELEASE_TAG.tar.gz" \
            release/release-manifest.json \
            release/provenance.json \
            release/artifact-digests.json

      - name: Resolve and verify exact draft contract before first publication
        id: draft
        if: steps.existing.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-pages-after-create.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          pages = json.load(open("release-pages-after-create.json", encoding="utf-8"))
          releases = [item for page in pages for item in page if item.get("tag_name") == tag]
          if len(releases) != 1 or releases[0].get("draft") is not True:
              raise SystemExit("exact newly-created draft Release is missing or ambiguous")
          release = releases[0]
          Path("created-draft-release.json").write_text(
              json.dumps(release, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          ident = release.get("id")
          if not isinstance(ident, int) or isinstance(ident, bool) or ident <= 0:
              raise SystemExit("draft Release id is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"release_id={ident}\n")
          PY
          python3 scripts/verify_published_release_v2.py \
            --repository-root . \
            --release-json created-draft-release.json \
            --release-dir release \
            --tag "$RELEASE_TAG" \
            --allow-draft

      - name: Compare exact draft asset bytes before publication
        if: steps.existing.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_json=existing-release.json
          if [[ "${{ steps.existing.outputs.state }}" = none ]]; then
            source_json=created-draft-release.json
          fi
          mkdir -p "$RUNNER_TEMP/exact-draft-assets"
          python3 - "$source_json" > "$RUNNER_TEMP/draft-assets.tsv" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          assets = release.get("assets", [])
          for asset in sorted(assets, key=lambda item: item["name"]):
              print(f"{asset['id']}\t{asset['name']}")
          PY
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$asset_name" != *$'\n'* && "$asset_name" != *$'\t'* && "$asset_name" != */* ]]
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$RUNNER_TEMP/exact-draft-assets/$asset_name"
            cmp -s -- "release/$asset_name" "$RUNNER_TEMP/exact-draft-assets/$asset_name" || {
              echo "draft asset bytes differ: $asset_name" >&2
              exit 1
            }
          done < "$RUNNER_TEMP/draft-assets.tsv"

      - name: Publish exact verified draft
        if: steps.existing.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_RELEASE_ID: ${{ steps.existing.outputs.release_id }}
          CREATED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$EXISTING_RELEASE_ID"
          if [[ -z "$release_id" ]]; then
            release_id="$CREATED_RELEASE_ID"
          fi
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            > published-transition.json

      - name: Verify final published immutable Release v2
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > published-release.json
          verification=$(python3 scripts/verify_published_release_v2.py \
            --repository-root . \
            --release-json published-release.json \
            --release-dir release \
            --tag "$RELEASE_TAG")
          echo "$verification"
          release_id=${verification##*=}
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub immutable Release attestation and every local asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release verify "$RELEASE_TAG"
          gh release verify-asset "$RELEASE_TAG" "release/mobile-proxy-linux-x86_64-$RELEASE_TAG.tar.gz"
          gh release verify-asset "$RELEASE_TAG" "release/mobile-proxy-android-$RELEASE_TAG.apk"
          gh release verify-asset "$RELEASE_TAG" "release/mobile-proxy-phone-production-runtime-$RELEASE_TAG.tar.gz"
          gh release verify-asset "$RELEASE_TAG" release/release-manifest.json
          gh release verify-asset "$RELEASE_TAG" release/provenance.json
          gh release verify-asset "$RELEASE_TAG" release/artifact-digests.json

      - name: Record bounded Product Release v2 result
        shell: bash
        run: |
          {
            echo '## Product Release v2'
            echo "- Release id: ${{ steps.final.outputs.release_id }}"
            echo "- Release tag: ${{ steps.tag.outputs.name }}"
            echo "- Exact source SHA: ${{ steps.tag.outputs.sha }}"
            echo "- Android package: com.example.mobileproxy"
            echo "- Android version: ${{ steps.tag.outputs.version }}"
            echo '- Exact signed Android APK included: true'
            echo '- Rooted phone runtime asset included: true'
            echo '- Rooted phone component inventory typed: true'
            echo '- Release manifest format: 2'
            echo '- Provenance format: 2'
            echo '- Provenance identity retry-stable: true'
            echo '- Typed Product Release digest set: true'
            echo '- Exact draft bytes verified before publication: true'
            echo '- GitHub Release immutable: true'
            echo '- Draft-first publication: true'
            echo '- Phone access performed: false'
            echo '- Deployment performed: false'
            echo '- Runtime execution authority created here: false'
            echo '- Next runtime authority belongs to Deployment Controller consuming this exact Product Release.'
          } >> "$GITHUB_STEP_SUMMARY"
