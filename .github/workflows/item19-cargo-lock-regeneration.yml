name: Item19 Cargo lock regeneration

on:
  push:
    branches:
      - item19-binding-store-vultr-executor

permissions:
  contents: write

concurrency:
  group: item19-cargo-lock-regeneration
  cancel-in-progress: false

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: item19-binding-store-vultr-executor
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain

      - name: Regenerate lock with Cargo
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          changed="$(git diff --name-only)"
          test "$changed" = "Cargo.lock"
          git diff -- Cargo.lock

      - name: Commit Cargo-generated lock only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "build: regenerate Cargo.lock for reqwest blocking"
          git push origin HEAD:item19-binding-store-vultr-executor
