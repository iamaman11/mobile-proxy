name: Temporary Item 19 PR ready transition

on:
  push:
    branches:
      - item19-slice-b-jit-acceptance
    paths:
      - .github/workflows/_temp_item19_mark_ready.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Assert exact PR head and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "iamaman11/mobile-proxy"
          test "${GITHUB_REF_NAME}" = "item19-slice-b-jit-acceptance"
          actual_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.head.sha')"
          actual_draft="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.draft')"
          actual_state="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.state')"
          test "${actual_head}" = "${EXPECTED_SHA}"
          test "${actual_draft}" = "true"
          test "${actual_state}" = "open"

      - name: Mark exact PR ready through GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_node_id="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.node_id')"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
            -F id="${pr_node_id}" \
            --jq '.data.markPullRequestReadyForReview.pullRequest | select(.number == 126 and .isDraft == false) | .number' \
            | grep -qx '126'

      - name: Assert post-transition exact head and ready state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.head.sha')"
          actual_draft="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.draft')"
          actual_state="$(gh api repos/${GITHUB_REPOSITORY}/pulls/126 --jq '.state')"
          test "${actual_head}" = "${EXPECTED_SHA}"
          test "${actual_draft}" = "false"
          test "${actual_state}" = "open"
