name: Rust Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

env:
  ARCHITECTURE_VALIDATION_LOG: ${{ runner.temp }}/architecture-validation.log
  CARGO_DENY_LOG: ${{ runner.temp }}/cargo-deny.log

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Format, Clippy, Test, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enforce architecture boundaries
        id: architecture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/check_architecture_boundaries.py
            python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          } 2>&1 | tee "$ARCHITECTURE_VALIDATION_LOG"

      - name: Upload architecture diagnostics
        if: steps.architecture.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: architecture-validation-${{ github.sha }}
          path: ${{ env.ARCHITECTURE_VALIDATION_LOG }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce architecture result
        if: steps.architecture.outcome == 'failure'
        run: exit 1

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Capture rustfmt patch
        if: steps.formatting.outcome == 'failure'
        run: |
          cargo fmt --all || true
          git diff --binary > rustfmt.patch

      - name: Upload rustfmt patch
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 7

      - name: Enforce formatting
        if: steps.formatting.outcome == 'failure'
        run: exit 1

      - name: Run strict Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: clippy-diagnostics-${{ github.sha }}
          path: clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Audit RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependency licenses, bans and sources
        id: cargo_deny
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo deny check advisories licenses bans sources 2>&1 | tee "$CARGO_DENY_LOG"

      - name: Upload cargo-deny diagnostics
        if: steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-deny-diagnostics-${{ github.sha }}
          path: ${{ env.CARGO_DENY_LOG }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cargo-deny result
        if: steps.cargo_deny.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/android-app/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run optional Android scaffold quality gate
        shell: bash
        run: |
          set -euo pipefail
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy NO_PROXY no_proxy || true
          cd apps/android-app
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
