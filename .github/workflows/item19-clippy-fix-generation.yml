name: Item19 Clippy fix generation

on:
  push:
    branches:
      - item19-binding-store-vultr-executor

permissions:
  contents: write

concurrency:
  group: item19-clippy-fix-generation
  cancel-in-progress: false

jobs:
  fix-clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: item19-binding-store-vultr-executor
          fetch-depth: 1

      - name: Apply exact bounded refactor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/operator-cli/src/github_vm_binding_store.rs')
          text = path.read_text()

          dead = '''impl AcceptanceVmLifecycleState {
              fn binding(&self) -> Option<&VmBinding> {
                  match self {
                      Self::Bound(binding)
                      | Self::DeletePrepared(binding)
                      | Self::DeleteDispatched(binding) => Some(binding),
                      Self::Empty
                      | Self::CreatePrepared { .. }
                      | Self::CreateDispatched { .. }
                      | Self::Terminal { .. } => None,
                  }
              }
          }

          '''
          assert text.count(dead) == 1, 'dead helper shape changed'
          text = text.replace(dead, '', 1)

          old = '''    fn append_transition(
                  &self,
                  intent: &OwnershipIntent,
                  before: &LedgerState,
                  transition: LedgerTransition,
                  generation: Generation,
                  expected: Option<&VmBinding>,
                  replacement: Option<&VmBinding>,
                  expected_after: AcceptanceVmLifecycleState,
              ) -> Result<(), BindingStoreError> {
                  let payload = GitHubDeploymentPayload {
          '''
          new = '''    fn append_transition(
                  &self,
                  before: &LedgerState,
                  transition: LedgerTransition,
                  generation: Generation,
                  expected: Option<&VmBinding>,
                  replacement: Option<&VmBinding>,
                  expected_after: AcceptanceVmLifecycleState,
              ) -> Result<(), BindingStoreError> {
                  let intent = OwnershipIntent::new(
                      LifecycleScope::Acceptance,
                      format!("candidate:{}", self.candidate_sha),
                  )
                  .map_err(|_| BindingStoreError::InvalidOwnershipIntent)?;
                  let payload = GitHubDeploymentPayload {
          '''
          assert text.count(old) == 1, 'append_transition signature shape changed'
          text = text.replace(old, new, 1)

          text, call_count = re.subn(r'(\.append_transition\(\n)\s*intent,\n', r'\1', text)
          assert call_count == 7, f'expected 7 append_transition call sites, found {call_count}'

          old_after = '        let after = self.current_state(intent)?;\n'
          new_after = '        let after = self.current_state(&intent)?;\n'
          assert text.count(old_after) == 1, 'post-append verification shape changed'
          text = text.replace(old_after, new_after, 1)

          assert 'fn binding(&self)' not in text
          assert not re.search(r'\.append_transition\(\n\s*intent,', text)
          path.write_text(text)
          PY

          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "apps/operator-cli/src/github_vm_binding_store.rs"
          git diff --check
          cargo fmt --all -- --check

      - name: Verify strict operator CLI Clippy
        run: |
          set -euo pipefail
          cargo clippy -p operator-cli --all-targets --locked -- -D warnings

      - name: Commit bounded Clippy fix only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operator-cli/src/github_vm_binding_store.rs
          test "$(git diff --cached --name-only)" = "apps/operator-cli/src/github_vm_binding_store.rs"
          git commit -m "fix: satisfy strict Clippy in durable binding store"
          git push origin HEAD:item19-binding-store-vultr-executor
