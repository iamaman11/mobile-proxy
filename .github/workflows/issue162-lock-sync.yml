name: issue162 workspace lock sync

on:
  push:
    branches:
      - issue162/android-v014-signing-migration

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue162/android-v014-signing-migration
      - name: Update only workspace package versions in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          workspace = {
              "control-plane",
              "host-daemon",
              "mobile-proxy-application",
              "mobile-proxy-control-plane-sqlite",
              "mobile-proxy-foundation",
              "operator-cli",
              "proxy-core",
              "relay-gate",
              "reverse-tunnel",
              "reverse-tunnel-server",
              "runtime-domain",
              "runtime-supervisor",
          }
          current = None
          changed = []
          output = []
          for line in lines:
              if line.startswith('name = "'):
                  current = line.split('"', 2)[1]
              if current in workspace and line == 'version = "0.1.3"\n':
                  line = 'version = "0.1.4"\n'
                  changed.append(current)
              output.append(line)
          if set(changed) != workspace or len(changed) != len(workspace):
              raise SystemExit(f"unexpected workspace lock update set: {sorted(changed)}")
          path.write_text("".join(output), encoding="utf-8")
          PY
          git diff --check
          changed_lines="$(git diff --numstat -- Cargo.lock)"
          test "${changed_lines}" = $'12\t12\tCargo.lock'
      - name: Commit synchronized lock file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "issue162: sync Cargo.lock for v0.1.4"
          git push origin HEAD:issue162/android-v014-signing-migration
