name: Item 20 non-live session orchestration

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: item20-non-live-session-orchestration
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected non-live single-SHA orchestration identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      control_plane_sha: ${{ steps.identity.outputs.control_plane_sha }}
    steps:
      - name: Validate trusted canonical control-plane ref
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "iamaman11/mobile-proxy" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]

      - name: Check out exact single-SHA candidate and control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Fetch exact-current protected state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/branches/main" \
            > current-main.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=push&status=success&head_sha=$CONTROL_PLANE_SHA&per_page=100" \
            > quality-runs.json
          gh api "repos/$GITHUB_REPOSITORY/issues/124" > item19-issue.json
          gh api "repos/$GITHUB_REPOSITORY/issues/135" > item20-issue.json
          gh api "repos/$GITHUB_REPOSITORY/issues/115" > signing-issue.json

      - name: Select exact successful single-SHA Quality push
        id: quality
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=$(python3 scripts/verify_item20_orchestration.py select-quality-run \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --runs quality-runs.json \
            --output selected-quality-run.json)
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify build-only Item 20 single-SHA orchestration boundary
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$CONTROL_PLANE_SHA"
          python3 scripts/verify_item20_orchestration.py verify \
            --candidate-sha "$CANDIDATE_SHA" \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --contract contracts/operations/item20-acceptance-v1.json \
            --main-branch current-main.json \
            --quality-run selected-quality-run.json \
            --item19-issue item19-issue.json \
            --item20-issue item20-issue.json \
            --signing-issue signing-issue.json \
            --output item20-non-live-orchestration-evidence.json
          python3 -m json.tool item20-non-live-orchestration-evidence.json >/dev/null
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'control_plane_sha=%s\n' "$CONTROL_PLANE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify admission-readiness contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/select_item20_candidate_evidence.py verify-contract \
            --contract contracts/operations/item20-admission-readiness-v1.json

      - name: Select, download, and verify exact existing admission readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=item20-admission-readiness-$CONTROL_PLANE_SHA&per_page=100" \
            > readiness-artifacts.json
          run_id=$(python3 scripts/verify_item20_readiness_artifact.py select-artifact \
            --candidate-sha "$CANDIDATE_SHA" \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --artifacts readiness-artifacts.json \
            --output selected-readiness-artifact.json)
          artifact_id=$(python3 -c 'import json; print(json.load(open("selected-readiness-artifact.json", encoding="utf-8"))["id"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > selected-readiness-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > readiness-evidence.zip
          mkdir readiness-evidence
          unzip -q readiness-evidence.zip -d readiness-evidence
          test -f readiness-evidence/item20-admission-readiness-evidence.json
          test "$(find readiness-evidence -maxdepth 2 -type f | wc -l)" -eq 1
          python3 scripts/verify_item20_readiness_artifact.py verify \
            --candidate-sha "$CANDIDATE_SHA" \
            --control-plane-sha "$CONTROL_PLANE_SHA" \
            --control-plane-quality-run-id "$QUALITY_RUN_ID" \
            --artifact selected-readiness-artifact.json \
            --run selected-readiness-run.json \
            --evidence readiness-evidence/item20-admission-readiness-evidence.json \
            --output item20-readiness-consumption-evidence.json
          python3 -m json.tool item20-readiness-consumption-evidence.json >/dev/null

      - name: Compile protected typed Item 20 lifecycle entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p operator-cli --bin item20-session-lifecycle

      - name: Upload bounded non-live orchestration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: item20-non-live-orchestration-${{ steps.identity.outputs.control_plane_sha }}
          path: |
            item20-non-live-orchestration-evidence.json
            item20-readiness-consumption-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Record validation-only result
        shell: bash
        run: |
          {
            echo '## Item 20 non-live single-SHA session orchestration'
            echo "- Candidate SHA: ${{ steps.identity.outputs.candidate_sha }}"
            echo "- Control-plane SHA: ${{ steps.identity.outputs.control_plane_sha }}"
            echo "- Control-plane Quality run: ${{ steps.quality.outputs.run_id }}"
            echo '- Candidate/control-plane exact equality required: true'
            echo '- Source freeze after candidate evidence required: true'
            echo '- Readiness artifact consumed: true'
            echo '- Candidate artifact build authorized: true'
            echo '- Typed Item 20 lifecycle entrypoint compiled: true'
            echo '- Typed Item 20 lifecycle entrypoint invoked: false'
            echo '- Fresh acceptance authority verified: true'
            echo '- Fresh Vultr read-only preflight verified: true'
            echo '- Fresh exact-candidate provider proof required before live window: true'
            echo '- Provider credentials consumed: false'
            echo '- Provider mutation authorized: false'
            echo '- Phone mutation authorized: false'
            echo '- Endpoint handoff authorized: false'
            echo '- Live execution authorized: false'
            echo '- Final production authority: false'
          } >> "$GITHUB_STEP_SUMMARY"

  build-candidate:
    name: Build exact immutable single-SHA candidate server artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
    steps:
      - name: Check out exact immutable software candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}

      - name: Assert immutable candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "${{ needs.validate.outputs.control_plane_sha }}"
          test -z "$(git status --porcelain)"

      - name: Build exact candidate server and artifact verifier
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            -p control-plane \
            -p relay-gate \
            -p reverse-tunnel-server
          cargo build --release --locked \
            -p operator-cli --bin item19-acceptance-lifecycle

      - name: Assemble and seal exact candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p item20-server-artifact/bin
          install -m 0755 target/release/control-plane item20-server-artifact/bin/control-plane
          install -m 0755 target/release/relay-gate item20-server-artifact/bin/relay-gate
          install -m 0755 target/release/reverse-tunnel-server item20-server-artifact/bin/reverse-tunnel-server
          install -m 0755 target/release/item19-acceptance-lifecycle item20-server-artifact/bin/item19-acceptance-lifecycle
          item20-server-artifact/bin/item19-acceptance-lifecycle prepare-artifact \
            --candidate-sha "$CANDIDATE_SHA" \
            --root item20-server-artifact \
            --manifest item20-server-artifact/manifest.json
          item20-server-artifact/bin/item19-acceptance-lifecycle verify-artifact \
            --candidate-sha "$CANDIDATE_SHA" \
            --root item20-server-artifact \
            --manifest item20-server-artifact/manifest.json

      - name: Upload exact immutable candidate server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: item20-server-candidate-${{ env.CANDIDATE_SHA }}
          path: item20-server-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Record build-only boundary
        shell: bash
        run: |
          {
            echo '## Item 20 exact single-SHA candidate artifact'
            echo "- Candidate SHA: $CANDIDATE_SHA"
            echo "- Control-plane SHA: ${{ needs.validate.outputs.control_plane_sha }}"
            echo '- Candidate/control-plane exact equality: true'
            echo '- Source checkout: exact immutable candidate'
            echo '- Provider lifecycle invoked: false'
            echo '- Phone execution invoked: false'
            echo '- Endpoint handoff performed: false'
          } >> "$GITHUB_STEP_SUMMARY"
