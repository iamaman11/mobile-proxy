[Service]
# The WSL host may advertise IPv6 while its upstream path cannot complete TLS to GitHub Actions.
# Scope the workaround to the .NET GitHub runner; do not change host, Windows, or phone networking.
Environment=DOTNET_SYSTEM_NET_DISABLEIPV6=1
# A TLS-terminating network path can also abort resumed SslStream sessions. Keep this runner on
# full handshakes; the setting is scoped to this one process.
Environment=DOTNET_SYSTEM_NET_SECURITY_DISABLETLSRESUME=1
